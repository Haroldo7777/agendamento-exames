<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Agendamento de Exames Ocupacionais</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f7f8fa;
  --text: #1a1a2e;
  --text2: #555770;
  --accent: #0d6e3e;
  --accent-light: #e8f5ee;
  --accent-hover: #0b5c34;
  --border: #d8dbe2;
  --danger: #c0392b;
  --danger-light: #fdecea;
  --warning: #e67e22;
  --warning-light: #fef5e7;
  --shadow: 0 2px 8px rgba(0,0,0,.07);
  --radius: 10px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #111827;
    --surface: #1f2937;
    --surface2: #283347;
    --text: #f1f3f5;
    --text2: #9ca3af;
    --accent: #34d399;
    --accent-light: #064e3b;
    --accent-hover: #6ee7b7;
    --border: #374151;
    --danger: #ef4444;
    --danger-light: #450a0a;
    --warning: #f59e0b;
    --warning-light: #451a03;
    --shadow: 0 2px 8px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg: #111827;
  --surface: #1f2937;
  --surface2: #283347;
  --text: #f1f3f5;
  --text2: #9ca3af;
  --accent: #34d399;
  --accent-light: #064e3b;
  --accent-hover: #6ee7b7;
  --border: #374151;
  --danger: #ef4444;
  --danger-light: #450a0a;
  --warning: #f59e0b;
  --warning-light: #451a03;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap-wide{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:4px;color:var(--accent)}
.subtitle{text-align:center;font-size:.82rem;color:var(--text2);margin-bottom:20px}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input[type="text"],input[type="tel"],input[type="email"],input[type="password"]{
  width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;
  font-size:1rem;background:var(--surface2);color:var(--text);
  transition:border-color .2s;
}
input:focus{outline:none;border-color:var(--accent)}
input:read-only{background:var(--accent-light);cursor:default}
.field{margin-bottom:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:12px 20px;border:none;border-radius:8px;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:background .2s,transform .1s;width:100%;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 12px;font-size:.78rem;width:auto;border-radius:6px}
.date-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.date-btn{
  padding:10px 8px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--surface2);color:var(--text);font-size:.85rem;
  cursor:pointer;text-align:center;transition:all .2s;
}
.date-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.date-btn.sel{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.msg{padding:12px 16px;border-radius:8px;font-size:.88rem;margin:12px 0;text-align:center;font-weight:500}
.msg-ok{background:var(--accent-light);color:var(--accent)}
.msg-err{background:var(--danger-light);color:var(--danger)}
.msg-warn{background:var(--warning-light);color:var(--warning)}
.hidden{display:none!important}
.link-gestor{
  text-align:center;margin-top:24px;padding-top:16px;
  border-top:1px solid var(--border);
}
.link-gestor a{font-size:.78rem;color:var(--text2);text-decoration:none;cursor:pointer}
.link-gestor a:hover{color:var(--accent)}
/* Login */
.login-box{max-width:380px;margin:60px auto;padding:16px}
/* Admin */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{
  padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;
  cursor:pointer;background:var(--surface2);color:var(--text2);border:1.5px solid transparent;
  transition:all .2s;
}
.tab.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:1.6rem;font-weight:700;color:var(--accent)}
.stat .l{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--accent-light);color:var(--accent);padding:10px 8px;text-align:left;font-weight:600;position:sticky;top:0}
td{padding:8px;border-bottom:1px solid var(--border);color:var(--text)}
tr:hover td{background:var(--surface2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:600}
.badge-ok{background:var(--accent-light);color:var(--accent)}
.badge-pend{background:var(--warning-light);color:var(--warning)}
.search-bar{margin-bottom:12px}
.search-bar input{padding:10px 12px;font-size:.88rem}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;
  align-items:center;justify-content:center;z-index:100;padding:16px;
}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal h3{margin-bottom:16px;font-size:1.05rem}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
.logout-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logout-bar span{font-size:.78rem;color:var(--text2)}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.day-section{margin-bottom:18px}
.day-title{font-weight:700;font-size:.92rem;color:var(--accent);margin-bottom:6px;padding:6px 0;border-bottom:2px solid var(--accent-light)}
.day-count{font-size:.78rem;color:var(--text2);font-weight:400}
</style>
</head>
<body>
<!-- ===== FORMULÁRIO PÚBLICO ===== -->
<div id="viewForm" class="wrap">
  <h1>Agendamento de Exames Ocupacionais</h1>
  <p class="subtitle">DETRAN-RR &mdash; Proteção e Saúde do Servidor</p>

  <div class="card" id="stepCpf">
    <div class="field">
      <label>Digite seu CPF</label>
      <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="buscarCPF()">Consultar</button>
    <div id="msgCpf"></div>
  </div>

  <div class="card hidden" id="stepDados">
    <div class="field"><label>Nome</label><input type="text" id="fNome" readonly></div>
    <div class="field"><label>Cargo</label><input type="text" id="fCargo" readonly></div>
    <div class="field"><label>Setor</label><input type="text" id="fSetor" readonly></div>
    <div class="field"><label>Admissão</label><input type="text" id="fAdmissao" readonly></div>
    <div class="field">
      <label>Telefone para contato</label>
      <input type="tel" id="fTelefone" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric">
    </div>
    <label style="margin-top:8px">Escolha a data do exame</label>
    <div class="date-grid" id="dateGrid"></div>
    <button class="btn btn-primary" onclick="confirmar()" id="btnConfirm">Confirmar Agendamento</button>
    <div id="msgDados"></div>
    <div style="margin-top:10px"><button class="btn btn-outline btn-sm" onclick="voltarCpf()">Voltar</button></div>
  </div>

  <div class="card hidden" id="stepOk">
    <div class="msg msg-ok" id="msgOk"></div>
    <button class="btn btn-outline" onclick="novoAgendamento()" style="margin-top:12px">Novo Agendamento</button>
  </div>

  <div class="link-gestor"><a onclick="showLogin()">Área do Gestor</a></div>
</div>

<!-- ===== LOGIN DO GESTOR ===== -->
<div id="viewLogin" class="login-box hidden">
  <h1>Área do Gestor</h1>
  <p class="subtitle">Acesso restrito</p>
  <div class="card">
    <div class="field"><label>E-mail</label><input type="email" id="loginEmail" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input type="password" id="loginSenha" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <div id="msgLogin"></div>
    <div style="margin-top:12px"><button class="btn btn-outline btn-sm" onclick="showForm()">Voltar ao Formulário</button></div>
  </div>
</div>

<!-- ===== PAINEL DO GESTOR ===== -->
<div id="viewAdmin" class="wrap-wide hidden">
  <div class="logout-bar">
    <h1 style="margin:0;text-align:left">Painel do Gestor</h1>
    <div><button class="btn btn-outline btn-sm" onclick="doLogout()">Sair</button></div>
  </div>

  <div class="stat-row" id="statsRow"></div>

  <div class="tabs">
    <div class="tab active" onclick="setAdminTab('agenda')" id="tabAgenda">Agenda por Data</div>
    <div class="tab" onclick="setAdminTab('agendamentos')" id="tabAgendamentos">Agendamentos</div>
    <div class="tab" onclick="setAdminTab('servidores')" id="tabServidores">Base de Servidores</div>
  </div>

  <div id="adminContent"></div>
</div>

<!-- ===== MODAL ===== -->
<div id="modalBg" class="modal-bg hidden" onclick="closeModal(event)">
  <div class="modal" id="modalBox" onclick="event.stopPropagation()"></div>
</div>

<script>
// ---- Config Supabase ----
const SB_URL = 'https://lxucuxbvjbabsdilrbwp.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4dWN1eGJ2amJhYnNkaWxyYndwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4MTUxMTUsImV4cCI6MjA5NzM5MTExNX0.oJIonn-n61pIr6Fb0IVpkXiPqfEKq4v9kdHUJa0eRrs';
const HEADERS = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'};

const DATES=["01/09 (Seg)","02/09 (Ter)","03/09 (Qua)","04/09 (Qui)","05/09 (Sex)",
"08/09 (Seg)","09/09 (Ter)","10/09 (Qua)","11/09 (Qui)","12/09 (Sex)",
"15/09 (Seg)","16/09 (Ter)","17/09 (Qua)","18/09 (Qui)","19/09 (Sex)",
"22/09 (Seg)","23/09 (Ter)","24/09 (Qua)","25/09 (Qui)","26/09 (Sex)",
"29/09 (Seg)","30/09 (Ter)"];

// ---- Credenciais Gestor ----
const _u=atob('aGFyb2xkby5tYXJyZWlybzEwQGdtYWlsLmNvbQ==');
const _p=atob('SmVzdXMxMDAj');

let LOGGED=false;
let selectedDate='';
let currentServidor=null;
let adminTab='agenda';

// ---- Helpers Supabase ----
async function sbGet(table, query=''){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?'+query,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, data){
  const r=await fetch(SB_URL+'/rest/v1/'+table,{method:'POST',headers:HEADERS,body:JSON.stringify(data)});
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return r.json();
}
async function sbPatch(table, id, data){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',headers:HEADERS,body:JSON.stringify(data)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, id){
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?id=eq.'+id,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error(await r.text());
}

// ---- Máscaras ----
function maskCPF(v){return v.replace(/\D/g,'').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2').slice(0,14)}
function maskTel(v){return v.replace(/\D/g,'').replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').slice(0,15)}
function rawCPF(v){return v.replace(/\D/g,'')}

document.getElementById('cpfInput').addEventListener('input',function(){this.value=maskCPF(this.value)});
document.getElementById('fTelefone').addEventListener('input',function(){this.value=maskTel(this.value)});

// ---- Navegação ----
function showView(id){['viewForm','viewLogin','viewAdmin'].forEach(v=>document.getElementById(v).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function showForm(){showView('viewForm');document.getElementById('stepCpf').classList.remove('hidden');document.getElementById('stepDados').classList.add('hidden');document.getElementById('stepOk').classList.add('hidden')}
function showLogin(){showView('viewLogin')}
function voltarCpf(){document.getElementById('stepCpf').classList.remove('hidden');document.getElementById('stepDados').classList.add('hidden');selectedDate='';currentServidor=null;clearMsg('msgDados')}

// ---- Formulário público ----
function renderDates(){
  const g=document.getElementById('dateGrid');
  g.innerHTML=DATES.map(d=>`<div class="date-btn" onclick="pickDate(this,'${d}')">${d}</div>`).join('');
}
function pickDate(el,d){
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');selectedDate=d;
}
function showMsg(id,cls,txt){const e=document.getElementById(id);e.className='msg '+cls;e.textContent=txt;e.style.display='block'}
function clearMsg(id){const e=document.getElementById(id);if(e){e.style.display='none';e.textContent=''}}

async function buscarCPF(){
  clearMsg('msgCpf');
  const cpf=rawCPF(document.getElementById('cpfInput').value);
  if(cpf.length!==11){showMsg('msgCpf','msg-err','CPF deve ter 11 dígitos.');return}

  // Checar se já agendou
  try{
    const ag=await sbGet('agendamentos_exames','cpf=eq.'+cpf+'&select=id');
    if(ag.length>0){showMsg('msgCpf','msg-err','JÁ CADASTRADO OU AGENDADO.');return}
  }catch(e){showMsg('msgCpf','msg-err','Erro de conexão. Tente novamente.');return}

  // Buscar na base
  try{
    const sv=await sbGet('servidores_efetivos','cpf=eq.'+cpf);
    if(sv.length===0){showMsg('msgCpf','msg-err','CPF não encontrado na base de servidores.');return}
    currentServidor=sv[0];
    document.getElementById('fNome').value=currentServidor.nome;
    document.getElementById('fCargo').value=currentServidor.cargo;
    document.getElementById('fSetor').value=currentServidor.setor;
    document.getElementById('fAdmissao').value=currentServidor.admissao;
    document.getElementById('fTelefone').value='';
    selectedDate='';
    renderDates();
    document.getElementById('stepCpf').classList.add('hidden');
    document.getElementById('stepDados').classList.remove('hidden');
  }catch(e){showMsg('msgCpf','msg-err','Erro de conexão. Tente novamente.')}
}

async function confirmar(){
  clearMsg('msgDados');
  const tel=document.getElementById('fTelefone').value;
  if(rawCPF(tel).length<10){showMsg('msgDados','msg-err','Informe um telefone válido.');return}
  if(!selectedDate){showMsg('msgDados','msg-err','Selecione uma data.');return}

  const btn=document.getElementById('btnConfirm');
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Salvando...';

  try{
    await sbPost('agendamentos_exames',{
      nome:currentServidor.nome,
      cpf:currentServidor.cpf,
      cargo:currentServidor.cargo,
      setor:currentServidor.setor,
      admissao:currentServidor.admissao,
      telefone:tel,
      data_exame:selectedDate
    });
    document.getElementById('stepDados').classList.add('hidden');
    document.getElementById('stepOk').classList.remove('hidden');
    document.getElementById('msgOk').textContent='Agendamento confirmado para '+currentServidor.nome+' em '+selectedDate+'.';
  }catch(e){
    if(e.message.includes('duplicate') || e.message.includes('unique')){
      showMsg('msgDados','msg-err','JÁ CADASTRADO OU AGENDADO.');
    } else {
      showMsg('msgDados','msg-err','Erro ao salvar. Tente novamente.');
    }
  }
  btn.disabled=false;btn.innerHTML='Confirmar Agendamento';
}

function novoAgendamento(){
  document.getElementById('cpfInput').value='';
  document.getElementById('stepOk').classList.add('hidden');
  document.getElementById('stepCpf').classList.remove('hidden');
  currentServidor=null;selectedDate='';
}

// ---- Login Gestor ----
function doLogin(){
  clearMsg('msgLogin');
  const e=document.getElementById('loginEmail').value.trim().toLowerCase();
  const s=document.getElementById('loginSenha').value;
  if(e===_u && s===_p){LOGGED=true;showView('viewAdmin');loadAdmin();}
  else{showMsg('msgLogin','msg-err','E-mail ou senha incorretos.')}
}
function doLogout(){LOGGED=false;showForm();document.getElementById('loginEmail').value='';document.getElementById('loginSenha').value=''}

// ---- Admin ----
function setAdminTab(t){
  adminTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
  renderAdmin();
}

let allAgendamentos=[];
let allServidores=[];

async function loadAdmin(){
  try{
    allAgendamentos=await sbGet('agendamentos_exames','order=data_exame.asc,nome.asc');
    allServidores=await sbGet('servidores_efetivos','order=nome.asc');
  }catch(e){document.getElementById('adminContent').innerHTML='<div class="msg msg-err">Erro ao carregar dados.</div>';return}
  renderStats();
  renderAdmin();
}

function renderStats(){
  const total=allServidores.length;
  const agendados=allAgendamentos.length;
  const pendentes=total-agendados;
  document.getElementById('statsRow').innerHTML=`
    <div class="stat"><div class="n">${total}</div><div class="l">Servidores</div></div>
    <div class="stat"><div class="n">${agendados}</div><div class="l">Agendados</div></div>
    <div class="stat"><div class="n">${pendentes}</div><div class="l">Pendentes</div></div>
    <div class="stat"><div class="n">${DATES.length}</div><div class="l">Datas</div></div>
  `;
}

function renderAdmin(){
  if(adminTab==='agenda') renderAgenda();
  else if(adminTab==='agendamentos') renderAgendamentos();
  else renderServidores();
}

function renderAgenda(){
  const byDate={};
  DATES.forEach(d=>byDate[d]=[]);
  allAgendamentos.forEach(a=>{if(byDate[a.data_exame])byDate[a.data_exame].push(a);});
  let html='';
  DATES.forEach(d=>{
    const list=byDate[d]||[];
    html+=`<div class="day-section"><div class="day-title">${d} <span class="day-count">(${list.length} agendado${list.length!==1?'s':''})</span></div>`;
    if(list.length){
      html+='<div class="tbl-wrap"><table><tr><th>Nome</th><th>Setor</th><th>Telefone</th><th></th></tr>';
      list.forEach(a=>{
        html+=`<tr><td>${a.nome}</td><td style="font-size:.75rem">${a.setor}</td><td>${a.telefone}</td>
        <td><button class="btn btn-outline btn-sm" onclick="editAgendamento(${a.id})">Editar</button></td></tr>`;
      });
      html+='</table></div>';
    } else {
      html+='<div style="font-size:.82rem;color:var(--text2);padding:4px 0">Nenhum agendamento</div>';
    }
    html+='</div>';
  });
  document.getElementById('adminContent').innerHTML=html;
}

function renderAgendamentos(){
  let html='<div class="search-bar"><input type="text" id="searchAg" placeholder="Buscar por nome ou CPF..." oninput="filterAgendamentos()"></div>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Cargo</th><th>Data</th><th>Telefone</th><th></th></tr></thead><tbody id="tbodyAg">';
  allAgendamentos.forEach(a=>{
    html+=`<tr><td>${a.nome}</td><td>${maskCPF(a.cpf)}</td><td style="font-size:.75rem">${a.cargo}</td><td>${a.data_exame}</td><td>${a.telefone}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-outline btn-sm" onclick="editAgendamento(${a.id})">Editar</button>
      <button class="btn btn-danger btn-sm" onclick="deleteAgendamento(${a.id},'${a.nome.replace(/'/g,"\\'")}')">Excluir</button>
    </td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('adminContent').innerHTML=html;
}

function filterAgendamentos(){
  const q=document.getElementById('searchAg').value.toLowerCase();
  const rows=document.getElementById('tbodyAg').querySelectorAll('tr');
  rows.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'});
}

function renderServidores(){
  const agCpfs=new Set(allAgendamentos.map(a=>a.cpf));
  let html='<div class="search-bar"><input type="text" id="searchSv" placeholder="Buscar por nome, CPF ou setor..." oninput="filterServidores()"></div>';
  html+='<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Cargo</th><th>Setor</th><th>Status</th></tr></thead><tbody id="tbodySv">';
  allServidores.forEach(s=>{
    const ok=agCpfs.has(s.cpf);
    html+=`<tr><td>${s.nome}</td><td>${maskCPF(s.cpf)}</td><td style="font-size:.75rem">${s.cargo}</td><td style="font-size:.75rem">${s.setor}</td>
    <td><span class="badge ${ok?'badge-ok':'badge-pend'}">${ok?'Agendado':'Pendente'}</span></td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('adminContent').innerHTML=html;
}

function filterServidores(){
  const q=document.getElementById('searchSv').value.toLowerCase();
  const rows=document.getElementById('tbodySv').querySelectorAll('tr');
  rows.forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'});
}

// ---- Modal Editar / Excluir ----
function editAgendamento(id){
  const a=allAgendamentos.find(x=>x.id===id);if(!a)return;
  let opts=DATES.map(d=>`<option value="${d}" ${d===a.data_exame?'selected':''}>${d}</option>`).join('');
  document.getElementById('modalBox').innerHTML=`
    <h3>Editar Agendamento</h3>
    <div class="field"><label>Nome</label><input type="text" value="${a.nome}" readonly></div>
    <div class="field"><label>Telefone</label><input type="tel" id="editTel" value="${a.telefone}" maxlength="15"></div>
    <div class="field"><label>Data do Exame</label><select id="editDate" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:.95rem;background:var(--surface2);color:var(--text)">${opts}</select></div>
    <div id="msgEdit"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEdit(${id})">Salvar</button>
    </div>`;
  document.getElementById('editTel').addEventListener('input',function(){this.value=maskTel(this.value)});
  document.getElementById('modalBg').classList.remove('hidden');
}

async function saveEdit(id){
  const tel=document.getElementById('editTel').value;
  const dt=document.getElementById('editDate').value;
  try{
    await sbPatch('agendamentos_exames',id,{telefone:tel,data_exame:dt});
    closeModal();await loadAdmin();
  }catch(e){showMsg('msgEdit','msg-err','Erro ao salvar.')}
}

function deleteAgendamento(id,nome){
  document.getElementById('modalBox').innerHTML=`
    <h3>Excluir Agendamento</h3>
    <p style="margin-bottom:12px;font-size:.9rem">Confirma a exclusão do agendamento de <strong>${nome}</strong>?</p>
    <div id="msgDel"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete(${id})">Excluir</button>
    </div>`;
  document.getElementById('modalBg').classList.remove('hidden');
}

async function confirmDelete(id){
  try{
    await sbDelete('agendamentos_exames',id);
    closeModal();await loadAdmin();
  }catch(e){showMsg('msgDel','msg-err','Erro ao excluir.')}
}

function closeModal(ev){
  if(ev && ev.target!==document.getElementById('modalBg'))return;
  document.getElementById('modalBg').classList.add('hidden');
}

// ---- Init ----
renderDates();
</script>
